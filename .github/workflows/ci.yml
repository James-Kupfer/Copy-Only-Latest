name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-syntax-check:
    name: Lint & syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Compile-check
        run: python -m py_compile copy_only_latest.py
